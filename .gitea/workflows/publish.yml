name: Publish Gitea package

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    if: false # Publishing is performed locally; constrained Actions runners cannot compile this Scala build reliably.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install sbt
        run: |
          apt-get update
          apt-get install --yes curl ca-certificates gnupg2
          curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x99E82A75642AC823' | gpg --dearmor -o /usr/share/keyrings/sbt.gpg
          echo 'deb [signed-by=/usr/share/keyrings/sbt.gpg] https://repo.scala-sbt.org/scalasbt/debian all main' > /etc/apt/sources.list.d/sbt.list
          echo 'deb [signed-by=/usr/share/keyrings/sbt.gpg] https://repo.scala-sbt.org/scalasbt/debian /' > /etc/apt/sources.list.d/sbt_old.list
          apt-get update
          apt-get install --yes sbt
      - name: Publish tagged artifact
        env:
          GITEA_USERNAME: ${{ secrets.PACKAGE_USERNAME }}
          GITEA_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Xss2m -XX:MaxMetaspaceSize=192m
          SBT_OPTS: -Dsbt.supershell=false -Dsbt.task.cpus=1
        run: |
          VERSION="${{ gitea.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="$VERSION" sbt -J-Xms128m -J-Xmx384m -J-Xss2m -J-XX:MaxMetaspaceSize=192m publish
