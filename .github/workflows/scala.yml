name: Scala CI

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run sbt build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt clean update scalafmtCheck compile test

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Publish release artifact
        env:
          GITEA_USERNAME: ${{ secrets.PACKAGE_USERNAME }}
          GITEA_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" sbt publish
